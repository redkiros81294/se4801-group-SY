spring.application.name=chaintrack
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# Schema is managed by Flyway (V1..V18). 'none' (was 'create-drop') prevents the
# dev default from wiping all data on every restart and conflicting with Flyway.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
# Keep Instant timestamps UTC across PostgreSQL round-trips so the SHA-256
# chain hashes computed over them verify deterministically.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.cache.disabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Structured logging & request tracing
# Log lines carry [traceId, spanId] so a single user action can be followed
# across log files; every request also gets a correlation id via the
# CorrelationIdFilter (honors inbound X-Request-Id, echoes it back).
logging.pattern.level=%5p [traceId=%X{traceId:-},spanId=%X{spanId:-},reqId=%X{reqId:-}]
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}

# Database (dev defaults, override with env vars)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5536/chaintrack}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:chaintrack_user}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:chaintrack_password}}

# JWT
jwt.secret=${JWT_SECRET:default-secret-key-change-in-production}

# Frontend CORS
frontend.url=${FRONTEND_URL:http://localhost:3000}

# SSO / OIDC (optional). When OIDC_ISSUER_URI + OIDC_CLIENT_ID are set, the
# login page shows a "Sign in with SSO" button; the flow issues the same
# ChainTrack JWT after a successful OIDC login.
# Provider registration is Spring-standard:
#   spring.security.oauth2.client.registration.chaintrack.client-id=${OIDC_CLIENT_ID:}
#   spring.security.oauth2.client.registration.chaintrack.client-secret=${OIDC_CLIENT_SECRET:}
#   spring.security.oauth2.client.registration.chaintrack.scope=openid,profile,email
#   spring.security.oauth2.client.provider.chaintrack.issuer-uri=${OIDC_ISSUER_URI:}
app.sso.registration-id=${OIDC_REGISTRATION_ID:chaintrack}
app.sso.enabled=${SSO_ENABLED:false}

# Mail Configuration (SMTP fallback when the Resend API key is not set)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
# Mail is optional: missing SMTP credentials must never block backend startup
# (hosting providers like Render may not provide them at first boot). Sending
# degrades gracefully to the Resend provider when EMAIL_PROVIDER=resend.
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Enterprise email via Resend (optional — falls back to SMTP above when unset)
app.email.provider=${EMAIL_PROVIDER:auto}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.from=${MAIL_FROM:}
