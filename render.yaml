# Render Blueprint — infrastructure as code for the ChainTrack backend.
# Deploys the Spring Boot API (Docker, JDK 21) with a managed PostgreSQL
# database on Render's private network.
#
# NOTE on the database URL: Render only exposes `postgresql://...` connection
# strings, but Spring/Hikari need `jdbc:postgresql://...`. So SPRING_DATASOURCE_URL
# is declared with `sync: false` — after this Blueprint runs, open the Postgres →
# Connect tab, copy the "Internal Database URL", prefix it with `jdbc:`, and set it
# on the backend service. The username/password are wired automatically below.

databases:
  - name: chaintrack
    plan: free
    postgresMajorVersion: "15"

services:
  - type: web
    name: chaintrack-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: chaintrack
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: chaintrack
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://redkiros81294.github.io/se4801-group-SY/
      - key: MAIL_USERNAME
        value: ab1rham5ethiopian@gmail.com
      - key: MAIL_PASSWORD
        sync: false
    healthCheckPath: /actuator/health
